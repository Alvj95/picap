name: Deploy to GitHub Pages

on:
  # Runs after each APK build so the site always serves the newest APK as a download mirror.
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
    branches: [main, claude/higgsfield-like-app-6htso1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Mirror latest APK on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern 'PicapStudio.apk' --dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
