name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android

      # The ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PicapStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: picap-studio-apk
          path: PicapStudio.apk
          if-no-files-found: error

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Picap Studio v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: PicapStudio.apk
          body: |
            APK de Android de Picap Studio (build de prueba, rama `${{ github.ref_name }}`).

            **Instalar:** descarga `PicapStudio.apk` desde el teléfono, ábrelo y permite instalar apps de origen desconocido.
